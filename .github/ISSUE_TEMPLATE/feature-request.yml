name: Feature Request
description: Suggest an improvement or new feature
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please check open issues first to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What use case does it enable?
      placeholder: "I'm trying to... but SubGen-Azure-Batch doesn't support..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe your proposed solution.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any workarounds?

  - type: dropdown
    id: area
    attributes:
      label: Feature Area
      options:
        - Web UI
        - Azure integration
        - Bazarr integration
        - Media server webhooks (Plex/Jellyfin/Emby)
        - Skip logic
        - Subtitle naming
        - Notifications
        - Docker / deployment
        - Other
    validations:
      required: true
