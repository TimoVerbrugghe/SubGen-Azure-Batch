name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form as completely as possible. Remove any API keys or tokens before submitting.

  - type: input
    id: version
    attributes:
      label: SubGen-Azure-Batch Version
      description: Check the `/status` endpoint or your Docker image tag.
      placeholder: e.g. 1.0.1
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Transcription Source
      description: How are you triggering transcription?
      options:
        - Web UI (batch)
        - Bazarr (ASR endpoint)
        - Plex webhook
        - Jellyfin webhook
        - Emby webhook
        - Tautulli webhook
    validations:
      required: true

  - type: textarea
    id: describe
    attributes:
      label: Describe the Bug
      description: What happened? What did you expect to happen?
      placeholder: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Configure ...
        2. Submit file ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste relevant Docker logs (`docker compose logs subgen`). **Redact any API keys or tokens.**
      render: shell

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Relevant environment variables. **Redact AZURE_SPEECH_KEY, AZURE_STORAGE_CONNECTION_STRING, and all tokens.**
      render: shell
